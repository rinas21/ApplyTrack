services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-applytrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-applytrack}
      POSTGRES_DB: ${POSTGRES_DB:-applytrack}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-applytrack} -d ${POSTGRES_DB:-applytrack}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-applytrack}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-applytrack}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;grep -q '200' <&3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-applytrack}:${POSTGRES_PASSWORD:-applytrack}@postgres:5432/${POSTGRES_DB:-applytrack}
      BIND_ADDR: 0.0.0.0:8080
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8180/realms/applytrack}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/applytrack/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-change-me-to-a-long-random-secret-at-least-32-bytes}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-applytrack}:${POSTGRES_PASSWORD:-applytrack}@postgres:5432/${POSTGRES_DB:-applytrack}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-change-me-to-a-long-random-secret-at-least-32-bytes}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-120}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api/v1}
        KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8180}
        KEYCLOAK_REALM: ${KEYCLOAK_REALM:-applytrack}
        KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-applytrack-web}
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
